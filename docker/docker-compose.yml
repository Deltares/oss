services:

  database:
    image: mariadb:11.8.8
    container_name: oss-mariadb-2026
    ports:
      - "3307:3306"
    env_file:
      - .env
    volumes:
      - dbliferay2026:/var/lib/mysql
      - ./resources/dump-liferay.sql:/docker-entrypoint-initdb.d/dump.sql
    restart: always
    networks:
      - liferay

#  mariadb-keycloak:
