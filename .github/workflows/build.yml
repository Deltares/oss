name: SonarQube
on:
  push:
    branches:
      - Liferay7.4
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Print tool versions
        run: |
          java -version
          ./gradlew --version

      - name: SonarQube analysis
        run: >
          ./gradlew sonar --info --stacktrace
          -Dsonar.token=${{ secrets.SONARCLOUD_TOKEN_2025 }}
          -Dsonar.scanner.truststorePath=${{ github.workspace }}/sonarcloud-truststore.p12
          -Dsonar.scanner.truststorePassword=${{ secrets.SONARCLOUD_TRUSTSTORE_PASS }}
          -Djavax.net.ssl.trustStoreType=PKCS12

