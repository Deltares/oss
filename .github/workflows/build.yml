name: SonarQube
on:
  push:
    branches: [Liferay7.4]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: gradle

      - name: SonarQube analysis
        run: >
          ./gradlew --no-daemon sonarqube --info
          -Dsonar.token=${{ secrets.SONARCLOUD_TOKEN_2025 }}
          -Djavax.net.ssl.trustStore=sonarcloud-truststore.p12
          -Djavax.net.ssl.trustStorePassword=${{ secrets.SONARCLOUD_TRUSTSTORE_PASS }}
          -Djavax.net.ssl.trustStoreType=PKCS12
