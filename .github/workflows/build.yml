name: SonarQube
on:
  push:
    branches: [Liferay7.4]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11 for build
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: gradle

      - name: Prepare truststore
        run: echo "$SONARCLOUD_TRUSTSTORE_B64" | base64 --decode > sonarcloud-truststore.p12
        env:
          SONARCLOUD_TRUSTSTORE_B64: ${{ secrets.SONARCLOUD_TRUSTSTORE_B64 }}

      - name: Build
        run: ./gradlew --no-daemon clean build

      - name: Set up JDK 21 for Sonar
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: SonarQube analysis
        run: >
          ./gradlew --no-daemon sonar --info
          -Dsonar.token=${{ secrets.SONARCLOUD_TOKEN_2025 }}
          -Djavax.net.ssl.trustStore=${{ github.workspace }}/sonarcloud-truststore.p12
          -Djavax.net.ssl.trustStorePassword=${{ secrets.SONARCLOUD_TRUSTSTORE_PASS }}
          -Djavax.net.ssl.trustStoreType=PKCS12

