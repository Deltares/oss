name: SonarQube
on:
  push:
    branches: [Liferay7.4]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 for build
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

#      - name: Prepare truststore
#        run: echo "$SONARCLOUD_TRUSTSTORE_B64" | base64 --decode > sonarcloud-truststore.p12
#        env:
#          SONARCLOUD_TRUSTSTORE_B64: ${{ secrets.SONARCLOUD_TRUSTSTORE_B64 }}

      - name: Build
        run: ./gradlew --no-daemon clean build

      - name: SonarQube analysis
        run: >
          ./gradlew --no-daemon sonar --info --debug

