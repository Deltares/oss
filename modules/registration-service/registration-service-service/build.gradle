dependencies {
	compileOnly project(":modules:registration-service:registration-service-api")

	compileOnly "com.liferay.portal:com.liferay.portal.kernel"
    compileOnly "com.liferay:com.liferay.petra.string"
    compileOnly "com.liferay:com.liferay.petra.lang"
    compileOnly "com.liferay:com.liferay.petra.io"
	compileOnly "com.liferay:com.liferay.petra.function"
	compileOnly "com.liferay:com.liferay.petra.sql.dsl.api"
	compileOnly "com.liferay:com.liferay.portal.aop.api"
	compileOnly "com.liferay:com.liferay.journal.api"
	compileOnly "org.osgi:org.osgi.annotation.versioning"
	compileOnly "org.osgi:org.osgi.service.component.annotations"


	implementation "com.liferay:com.liferay.portal.upgrade.api:2.0.3"

}


buildService {
	apiDir = "../registration-service-api/src/main/java"
	databaseNameMaxLength = 64
}

group = "nl.deltares.dsd.registration"