<svg xmlns="http://www.w3.org/2000/svg" width="34px" height="34px" viewBox="0 0 34 34">
  <!-- Monitor screen -->
  <rect x="1" y="2" width="32" height="22" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- Stand -->
  <line x1="17" y1="24" x2="17" y2="29" stroke="#000000" stroke-width="2"/>
  <!-- Base -->
  <line x1="11" y1="29" x2="23" y2="29" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Code brackets: < -->
  <polyline points="12,8 7,13 12,18" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Code brackets: > -->
  <polyline points="22,8 27,13 22,18" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Slash: / -->
  <line x1="19" y1="8" x2="15" y2="18" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
</svg>
